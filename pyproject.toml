[project]
name = "clip2text"
version = "0.1.0"
description = "本地优先的音视频文案提取工具：上传文件、转写、导出，默认零 API key"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "clip2text contributors" }]
keywords = ["asr", "transcription", "whisper", "ocr", "subtitle", "local-first"]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.17",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "static-ffmpeg>=3.0",
  "Pillow>=10.0",
]

[project.optional-dependencies]
# 本地 ASR 引擎，体积较大，按需安装
faster = ["faster-whisper>=1.2"]
# Apple Silicon 专用，速度最快
mlx = ["mlx-whisper>=0.4.3"]
# 中文场景优化（含标点/语气词）
funasr = ["funasr>=1.4"]
# 本地 OCR
ocr = ["rapidocr-onnxruntime>=1.4"]
# 平台链接解析（默认关闭，见 README 合规说明）
extract = ["yt-dlp>=2025.1.1"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[project.scripts]
clip2text = "clip2text.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clip2text"]

# 前端静态文件（html/css/js）放在 src/clip2text/web 下，
# 因为已经在 packages 里，hatchling 会自动打包，不需要 force-include
# （加了反而会因为同一路径重复而报错）。

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP042"]  # UP042: pydantic v2 仍需 str+Enum 而非 StrEnum
